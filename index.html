<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de GitHub — Comandos Esenciales</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #eeeeec;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #625f5a;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --info-bg: #e6f1fb;
    --info-text: #185fa5;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --warn-bg: #faeeda;
    --warn-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --mono: 'Courier New', monospace;
    --sans: system-ui, -apple-system, sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2c;
      --text: #f0ede8;
      --text2: #a8a69f;
      --text3: #a09e97;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --info-bg: #0c2a42;
      --info-text: #85b7eb;
      --success-bg: #173404;
      --success-text: #97c459;
      --warn-bg: #2a1a04;
      --warn-text: #ef9f27;
      --danger-bg: #2a0f0f;
      --danger-text: #f09595;
    }
  }

  body {
    font-family: var(--sans);
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 780px; margin: 0 auto; }

  .top-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 1.5rem; flex-wrap: wrap;
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 600; color: var(--text);
  }

  .brand-icon {
    width: 32px; height: 32px;
    background: var(--text);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-icon svg { fill: var(--bg); }

  .search-wrap { flex: 1; min-width: 200px; }
  .search-wrap input {
    width: 100%; padding: 8px 14px;
    font-size: 14px; font-family: var(--sans);
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--text3); }
  .search-wrap input::placeholder { color: var(--text3); }

  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .tag {
    font-size: 12px; padding: 5px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer; transition: all .15s;
    user-select: none;
  }
  .tag:hover { background: var(--bg); color: var(--text); }
  .tag.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .section-card {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--bg);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .section-card:hover { border-color: var(--border2); }
  .section-card.hidden { display: none; }

  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; cursor: pointer; gap: 12px;
    user-select: none;
  }
  .section-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .sec-num {
    font-size: 11px; font-family: var(--mono);
    padding: 2px 7px;
    background: var(--bg2);
    border-radius: 4px;
    color: var(--text2);
    border: 0.5px solid var(--border);
  }
  .sec-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .sec-tag {
    font-size: 11px; padding: 2px 8px;
    border-radius: 4px; font-weight: 500;
  }
  .sec-tag.init    { background: var(--info-bg);    color: var(--info-text); }
  .sec-tag.branch  { background: var(--success-bg); color: var(--success-text); }
  .sec-tag.sync    { background: var(--warn-bg);    color: var(--warn-text); }
  .sec-tag.danger  { background: var(--danger-bg);  color: var(--danger-text); }
  .sec-tag.flow    { background: var(--bg2);         color: var(--text2); border: 0.5px solid var(--border); }
  .sec-tag.windows { background: var(--info-bg);    color: var(--info-text); }

  .chevron { font-size: 13px; color: var(--text3); transition: transform .2s; }
  .section-card.open .chevron { transform: rotate(180deg); }

  .section-body {
    display: none;
    padding: 0 18px 16px;
    border-top: 0.5px solid var(--border);
  }
  .section-card.open .section-body { display: block; }

  .desc {
    font-size: 14px; color: var(--text2);
    margin: 12px 0 10px; line-height: 1.65;
  }

  .cmd-block {
    background: var(--bg2);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    margin-bottom: 10px; overflow: hidden;
  }
  .cmd-label {
    font-size: 11px; color: var(--text3);
    font-family: var(--mono);
    padding: 6px 12px 0; display: block;
  }
  .cmd-row {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 8px;
    padding: 6px 12px 10px;
  }
  .cmd-code {
    font-family: var(--mono); font-size: 13px;
    color: var(--text); white-space: pre; line-height: 1.6;
    flex: 1; overflow-x: auto;
  }
  .copy-btn {
    font-size: 11px; padding: 3px 10px;
    background: transparent;
    border: 0.5px solid var(--border2);
    border-radius: 4px; color: var(--text2);
    cursor: pointer; white-space: nowrap;
    flex-shrink: 0; margin-top: 2px;
    transition: all .15s; font-family: var(--sans);
  }
  .copy-btn:hover { background: var(--bg3); color: var(--text); }
  .copy-btn.copied { color: var(--success-text); }

  .table-wrap { overflow-x: auto; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    padding: 8px 12px; text-align: left;
    font-weight: 500; font-size: 12px;
    color: var(--text2);
    border-bottom: 0.5px solid var(--border);
  }
  td {
    padding: 8px 12px;
    border-bottom: 0.5px solid var(--border);
    color: var(--text); vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--text2); }
  td code {
    font-family: var(--mono); font-size: 12px;
    background: var(--bg2); padding: 2px 6px;
    border-radius: 3px; color: var(--text);
  }

  .steps-list { list-style: none; counter-reset: step; }
  .steps-list li {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0; border-bottom: 0.5px solid var(--border);
  }
  .steps-list li:last-child { border-bottom: none; }
  .step-num {
    min-width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-family: var(--mono);
    color: var(--text2); flex-shrink: 0; margin-top: 2px;
  }
  .step-content { flex: 1; }
  .step-content p { font-size: 14px; color: var(--text2); margin-bottom: 6px; }

  .no-results {
    text-align: center; padding: 3rem 1rem;
    color: var(--text3); font-size: 14px;
  }

  footer {
    text-align: center; margin-top: 2rem;
    font-size: 12px; color: var(--text3);
  }
  footer a { color: var(--info-text); text-decoration: underline; }

  .tag { font-family: var(--sans); }
  :focus-visible { outline: 2px solid var(--info-text); outline-offset: 2px; }
  .sec-tag.info { background: var(--info-bg); color: var(--info-text); }
  .sec-tag.faq  { background: var(--success-bg); color: var(--success-text); }
  .desc strong { color: var(--text); font-weight: 600; }
  .faq details { border-bottom: 0.5px solid var(--border); padding: 10px 0; }
  .faq details:last-child { border-bottom: none; }
  .faq summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); }
  .faq details p { font-size: 14px; color: var(--text2); line-height: 1.65; margin-top: 8px; }
  .links { list-style: none; margin-top: 10px; }
  .links li { font-size: 14px; color: var(--text2); padding: 6px 0; line-height: 1.5; }
  .links a { color: var(--info-text); }
  code { font-family: var(--mono); font-size: 12px; background: var(--bg2); padding: 1px 5px; border-radius: 3px; }

  @media print {
    body { background: #fff; padding: 0; }
    .top-bar, .tags, .copy-btn, .chevron { display: none; }
    .section-card, .section-card.hidden { display: block; break-inside: avoid; }
    .section-body { display: block; }
    .cmd-code { white-space: pre-wrap; }
  }

  .flow-jump { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--border2); padding: 13px 16px; border-radius: var(--radius-lg); text-decoration: none; }
  .flow-jump:hover { border-color: var(--info-text); }
  .flow-jump strong { display: block; font-size: 14px; margin-bottom: 4px; }
  .flow-jump small { display: block; font-size: 12px; color: var(--text2); line-height: 1.5; }
  .flow-jump .flow-jump-arrow { color: var(--info-text); font-size: 21px; flex-shrink: 0; }
  /* Guía interactiva: flujo por equipo y situación */
  .flow-guide { margin-top: 14px; }
  .flow-question { font-size: 12px; font-weight: 700; color: var(--text2); margin: 16px 0 8px; }
  .flow-device-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .flow-device-btn, .flow-case-btn { font-family: var(--sans); cursor: pointer; color: var(--text); text-align: left; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .15s, background .15s; }
  .flow-device-btn { font-size: 14px; padding: 12px; font-weight: 600; }
  .flow-device-btn small { display: block; font-size: 11px; font-weight: 400; color: var(--text2); margin-top: 4px; line-height: 1.5; }
  .flow-device-btn:hover, .flow-case-btn:hover { border-color: var(--border2); }
  .flow-device-btn[aria-pressed="true"], .flow-case-btn[aria-pressed="true"] { background: var(--info-bg); border-color: var(--info-text); }
  .flow-device-btn[aria-pressed="true"] small { color: var(--info-text); }
  .flow-case-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .flow-variant-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0 13px; }
  .flow-variant-btn { cursor: pointer; font: inherit; text-align: left; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 12px; color: var(--text); }
  .flow-variant-btn:hover { border-color: var(--border2); }
  .flow-variant-btn[aria-pressed="true"] { background: var(--info-bg); border-color: var(--info-text); }
  .flow-variant-btn strong { display: block; font-size: 13px; line-height: 1.5; }
  .flow-variant-btn small { display: block; font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.5; }
  .flow-extra-question { font-size: 12px; font-weight: 700; margin: 12px 0 6px; color: var(--text); }

  .flow-case-btn { padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .flow-case-btn strong { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .flow-case-btn span { display: block; color: var(--text2); }
  .flow-detail { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .flow-detail h3 { font-size: 17px; font-weight: 650; margin-bottom: 6px; }
  .flow-summary { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 12px; }
  .flow-note { font-size: 12px; line-height: 1.7; padding: 10px 12px; border: 1px solid var(--border); border-left: 3px solid var(--info-text); background: var(--info-bg); color: var(--info-text); border-radius: var(--radius); margin: 10px 0; }
  .flow-note.warning { background: var(--warn-bg); border-left-color: var(--warn-text); color: var(--warn-text); }
  .flow-steps { list-style: none; counter-reset: flow-step; margin-top: 14px; }
  .flow-steps > li { display: flex; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .flow-steps > li:last-child { border-bottom: none; }
  .flow-steps .flow-step-count { display: flex; justify-content: center; align-items: center; width: 25px; height: 25px; border: 1px solid var(--border2); background: var(--bg2); border-radius: 50%; font-size: 12px; flex: 0 0 25px; }
  .flow-step-content { flex: 1; min-width: 0; }
  .flow-step-title { font-size: 13px; font-weight: 650; line-height: 1.6; }
  .flow-step-explain { color: var(--text2); font-size: 12px; line-height: 1.7; margin: 4px 0 8px; }
  .flow-steps .cmd-block { margin: 6px 0 0; }
  .flow-stage { margin-top: 13px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; color: var(--text2); font-size: 11px; }
  .flow-stage span { padding: 4px 7px; border-radius: 4px; background: var(--bg2); border: 1px solid var(--border); }
  .flow-stage span:last-child { background: var(--success-bg); color: var(--success-text); }
  .flow-stage em { font-style: normal; font-weight: 700; }
  @media (max-width: 540px) {
    .flow-device-buttons, .flow-case-buttons, .flow-variant-buttons { grid-template-columns: 1fr; }
    .flow-step-count { width: 23px; height: 23px; }
    .flow-stage { gap: 4px; }
  }
  @media print {
    .flow-device-buttons, .flow-case-buttons, .flow-variant-buttons, .flow-jump { display: none; }
    .flow-detail { display: block; }
  }
</style>
</head>

      <div class="brand-icon">

<script>

    blocks:[

const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function copyCode(btn) {
  navigator.clipboard.writeText(btn.dataset.code).then(() => {
    btn.textContent = "copiado ✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copiar"; btn.classList.remove("copied"); }, 1500);
  });
}

function renderBlock(b) {
  return `<div class="cmd-block">
    ${b.label ? `<span class="cmd-label">${b.label}</span>` : ''}
    <div class="cmd-row">
      <pre class="cmd-code">${esc(b.code)}</pre>
      <button type="button" class="copy-btn" data-code="${esc(b.code)}" aria-label="Copiar comando">copiar</button>
    </div>
  </div>`;
}

let activeFlowLocation = 'habitual';
let activeFlowId = 'primer';
let activeStartVariant = 'cero';

function renderScenarioGuide() {
  return `<div class="flow-guide">
    <p class="flow-question">1. ¿En qué computadora estás?</p>
    <div class="flow-device-buttons" role="group" aria-label="Computadora en la que estás trabajando">
      <button type="button" class="flow-device-btn" data-flow-location="habitual" aria-pressed="true">Estoy en mi PC habitual<small>Donde normalmente desarrollo mis proyectos</small></button>
      <button type="button" class="flow-device-btn" data-flow-location="otra" aria-pressed="false">Estoy en otra PC<small>Otra laptop, computadora de la escuela o del trabajo</small></button>
    </div>
    <p class="flow-question">2. ¿Qué quieres hacer?</p>
    <div class="flow-case-buttons" id="flow-case-buttons" role="group" aria-label="Elegir escenario"></div>
    <div class="flow-detail" id="flow-detail" aria-live="polite"></div>
    <div class="flow-stage" aria-label="Etapas de publicación de cambios">
      <span>Archivos modificados</span><em>→</em><span>git add</span><em>→</em><span>git commit (local)</span><em>→</em><span>git push (GitHub)</span>
    </div>
  </div>`;
}

function renderFlowSelection() {
  const choices = flowCases[activeFlowLocation];
  if (!choices.some(c => c.id === activeFlowId)) activeFlowId = choices[0].id;
  const current = choices.find(c => c.id === activeFlowId);
  document.querySelectorAll('.flow-device-btn').forEach(btn =>
    btn.setAttribute('aria-pressed', String(btn.dataset.flowLocation === activeFlowLocation)));
  const options = document.getElementById('flow-case-buttons');
  if (!options) return;
  options.innerHTML = choices.map(c => `<button type="button" class="flow-case-btn" data-flow-case="${esc(c.id)}" aria-pressed="${c.id === activeFlowId}"><strong>${esc(c.short)}</strong><span>${esc(c.sub)}</span></button>`).join('');
  const detail = document.getElementById('flow-detail');
  const variant = current.variants ? current.variants.find(v => v.id === activeStartVariant) || current.variants[0] : null;
  const active = variant || current;
  const variantSelector = current.variants ? `<p class="flow-extra-question">3. ¿Desde dónde empiezas?</p>
    <div class="flow-variant-buttons" role="group" aria-label="Estado inicial de tu proyecto">
    ${current.variants.map(v => `<button type="button" class="flow-variant-btn" data-flow-variant="${esc(v.id)}" aria-pressed="${v.id === active.id}">
       <strong>${esc(v.short)}</strong><small>${esc(v.sub)}</small></button>`).join('')}
    </div>` : '';
  detail.innerHTML = `<h3>${esc(current.title)}</h3><p class="flow-summary">${esc(current.intro)}</p>
    <div class="flow-note ${current.id === 'sin-push' || current.id === 'regreso' ? 'warning' : ''}">${esc(current.note)}</div>
    ${variantSelector}
    ${variant ? `<p class="flow-summary">${esc(variant.intro)}</p>` : ''}
    <ol class="flow-steps">${active.steps.map((st,i) => `<li>
       <span class="flow-step-count" aria-hidden="true">${i+1}</span>
       <div class="flow-step-content"><div class="flow-step-title">${esc(st.title)}</div>
       <p class="flow-step-explain">${esc(st.why)}</p>
       ${st.codeCmd ? renderBlock({label:'CMD', code:st.codeCmd}) : ''}
       ${st.codePowerShell ? renderBlock({label:'PowerShell', code:st.codePowerShell}) : ''}
       ${st.code ? renderBlock({code:st.code}) : ''}</div>
    </li>`).join('')}</ol>
    <div class="flow-note">${esc(active.ending)}</div>`;
}

function renderSection(s) {
  let body = s.desc ? `<p class="desc">${s.desc}</p>` : '';
  if (s.text) body += s.text.map(t => `<p class="desc">${t}</p>`).join('');
  if (s.scenarioGuide) body += renderScenarioGuide();
  if (s.blocks) body += s.blocks.map(renderBlock).join('');
  if (s.table) {
    const cc = s.table.codeCol ?? 1;
    body += `<div class="table-wrap"><table>
      <tr>${s.table.headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr>
      ${s.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===cc?`<code>${esc(c)}</code>`:c}</td>`).join('')}</tr>`).join('')}
    </table></div>`;
  }
  if (s.steps) {
    body += `<ol class="steps-list">` + s.steps.map((st,i)=>`
      <li>
        <div class="step-num">${i+1}</div>
        <div class="step-content">
          <p>${st.label}</p>
          ${st.code ? renderBlock({code:st.code}) : ''}
        </div>
      </li>`).join('') + `</ol>`;
  }
  if (s.faq) body += `<div class="faq">${s.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join('')}</div>`;
  if (s.links) body += `<ul class="links">${s.links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.text}</a> — ${l.desc}</li>`).join('')}</ul>`;
  return `<div class="section-card" ${s.scenarioGuide ? 'id="flow-guide"' : ''} data-tag="${s.tag}" data-name="${s.name.toLowerCase()}" data-num="${s.num.toLowerCase()}">
    <div class="section-header" role="button" tabindex="0" aria-expanded="false">
      <div class="section-title">
        <span class="sec-num">${s.num}</span>
        <span class="sec-name">${s.name}</span>
        <span class="sec-tag ${s.tag}">${s.tagLabel}</span>
      </div>
      <span class="chevron" aria-hidden="true">▾</span>
    </div>
    <div class="section-body">${body}</div>
  </div>`;
}

const sectionsEl = document.getElementById('sections');
sectionsEl.innerHTML = data.map(renderSection).join('');
renderFlowSelection();
// Abrimos el módulo de flujo por defecto para que la elección sea visible.
const flowCard = sectionsEl.querySelector('[data-num="11"]');
flowCard.classList.add('open');
flowCard.querySelector('.section-header').setAttribute('aria-expanded', 'true');

function toggleCard(header) {
  header.setAttribute('aria-expanded', header.parentElement.classList.toggle('open'));
}

sectionsEl.addEventListener('click', e => {
  const copy = e.target.closest('.copy-btn');
  if (copy) { copyCode(copy); return; }
  const location = e.target.closest('.flow-device-btn');
  if (location) { activeFlowLocation = location.dataset.flowLocation; renderFlowSelection(); return; }
  const choice = e.target.closest('.flow-case-btn');
  if (choice) { activeFlowId = choice.dataset.flowCase; renderFlowSelection(); return; }
  const startingPoint = e.target.closest('.flow-variant-btn');
  if (startingPoint) { activeStartVariant = startingPoint.dataset.flowVariant; renderFlowSelection(); return; }
  const header = e.target.closest('.section-header');
  if (header) toggleCard(header);
});

sectionsEl.addEventListener('keydown', e => {
  const header = e.target.closest('.section-header');
  if (header && e.target === header && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    toggleCard(header);
  }
});

let activeFilter = 'all';

document.getElementById('tags').addEventListener('click', e => {
  const tag = e.target.closest('.tag');
  if (!tag) return;
  activeFilter = tag.dataset.filter;
  document.querySelectorAll('.tag').forEach(t => {
    const on = t.dataset.filter === activeFilter;
    t.classList.toggle('active', on);
    t.setAttribute('aria-pressed', on);
  });
  applyFilters();
});

document.getElementById('search').addEventListener('input', applyFilters);

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  let visible = 0;
  document.querySelectorAll('.section-card').forEach(card => {
    const matchTag = activeFilter === 'all' || card.dataset.tag === activeFilter;
    const matchQ = !q || card.dataset.name.includes(q) || card.dataset.num.includes(q) ||
      card.querySelector('.section-body').textContent.toLowerCase().includes(q);
    const show = matchTag && matchQ;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
    if (q && show) {
      card.classList.add('open');
      card.querySelector('.section-header').setAttribute('aria-expanded', 'true');
    }
  });
  document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
}
</script>
